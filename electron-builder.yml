appId: app.lumen.iptv
productName: Lumen
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack: []
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Lumen-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Lumen
npmRebuild: false
# Auto-update: the installed app checks GitHub Releases of this repo (needs a public repo)
publish:
  provider: github
  owner: Willel09
  repo: willepilletv
  releaseType: release
