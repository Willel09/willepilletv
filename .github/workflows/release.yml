# Builds and publishes a release whenever the version in package.json changes on the default branch
# (or when started by hand from the Actions tab). No terminal or tags needed:
#   - Windows installer + latest.yml  → GitHub Release (installed apps auto-update from it)
#   - Lumen.wgt for Samsung TVs       → GitHub Release (SmartTV Installer: custom repo Willel09/willepilletv)
#   - Web app                         → GitHub Pages (TVs load new versions from here on start)
name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$V is already released, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing v$V"
          fi

  windows:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  tv-and-web:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tv
      - uses: actions/upload-artifact@v4
        with:
          name: tv
          path: dist/Lumen.wgt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  release:
    needs: [check, windows, tv-and-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: Lumen ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          make_latest: true
          body: |
            **Windows:** download `Lumen-Setup-${{ needs.check.outputs.version }}.exe` below and open it. Installed apps update themselves.
            **Samsung TV:** use the "Install on Samsung TV" assistant in Lumen for Windows (Settings), or SmartTV Installer → Custom GitHub Repository → `Willel09/willepilletv`.

  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
